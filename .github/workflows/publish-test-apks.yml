name: Publish installable Leotv APK release

on:
  workflow_run:
    workflows: [Build and audit ordinary APKs]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful fixed-signature build run
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: leotv-apk-release-${{ github.event.workflow_run.id || inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      actions: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK publication guards and repeat handling
        run: python3 -B research/test_apk_publish_workflow.py
      - name: Retrieve verified signed APKs and publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          EXPECTED_CERT: ${{ vars.APK_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, zipfile, xml.etree.ElementTree as ET
          sys.path.insert(0, 'tools')
          from apk_products import PRODUCTS, BASE_VARIANTS, source_variant, player_profile
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['BUILD_RUN_ID']
          if not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit('A positive build run ID is required.')
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if data['conclusion'] != 'success' or data['name'] != 'Build and audit ordinary APKs':
              raise SystemExit('A successful ordinary APK build run is required.')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publish-apks'
          files = []
          version = None
          channel = None
          staged_version = None
          products = list(BASE_VARIANTS)
          declared_products = None
          parity = {}
          for variant in products:
              target = root / variant
              target.mkdir(parents=True, exist_ok=True)
              downloaded = subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo, '--name',
                  f'ordinary-{variant}-signed', '--dir', str(target)], capture_output=True, text=True)
              if downloaded.returncode != 0:
                  if staged_version is None:
                      manifest = json.loads(subprocess.check_output(['gh', 'api',
                          f"repos/{repo}/contents/branding/AndroidManifest.xml?ref={data['head_sha']}"]))
                      staged_version = ET.fromstring(base64.b64decode(manifest['content'])).attrib['{http://schemas.android.com/apk/res/android}versionName']
                  staged_tag = f'leotv-{staged_version}-build-{run_id}'
                  subprocess.run(['gh', 'release', 'download', staged_tag, '--repo', repo, '--dir', str(target), '--clobber',
                      '--pattern', f'leotv-{variant}.apk', '--pattern', f'leotv-{variant}.signature.json',
                      '--pattern', f'leotv-{variant}-unsigned.audit.json',
                      *(['--pattern', f'leotv-{variant}-player-source.tar.gz'] if variant.startswith('tv') else [])], check=True)
              report = json.loads((target / f'leotv-{variant}.signature.json').read_text())
              audit = json.loads((target / f'leotv-{variant}-unsigned.audit.json').read_text())
              apk = target / f'leotv-{variant}.apk'
              declared = audit.get('delivery_products', list(BASE_VARIANTS))
              if declared not in (list(BASE_VARIANTS), list(PRODUCTS)):
                  raise SystemExit('Unexpected APK delivery product set.')
              if audit['version_code'] >= 659 and declared != list(PRODUCTS):
                  raise SystemExit('5.3.5 and later require eight verified APK products.')
              if declared_products is None:
                  declared_products = declared
                  products.extend(product for product in declared if product not in products)
              elif declared != declared_products:
                  raise SystemExit('APK products declare different delivery matrices.')
              profile = player_profile(variant)
              if audit['version_code'] >= 659 and (audit.get('product') != variant or audit.get('variant') != source_variant(variant) or audit.get('player_profile') != profile):
                  raise SystemExit('APK source/profile identity differs from its product.')
              if audit['version_code'] >= 659:
                  fingerprints = tuple(audit.get(key) for key in ('shared_feature_source_sha256','shared_feature_hooks_sha256','shared_zip_payload_sha256'))
                  if any(not isinstance(value,str) or len(value)!=64 for value in fingerprints):
                      raise SystemExit('Both player profiles require shared-feature and payload fingerprints.')
                  parity.setdefault(source_variant(variant), {})[profile] = fingerprints
              if report['certificate_sha256'] != os.environ['EXPECTED_CERT'] or hashlib.sha256(apk.read_bytes()).hexdigest() != report['apk_sha256']:
                  raise SystemExit('Signed APK identity verification failed.')
              if audit['package'] != 'com.leotv.app' or not audit['expected_changes_match'] or not audit['baseline_audit']['equal']:
                  raise SystemExit('Leotv identity/source audit verification failed.')
              if audit['version_code'] >= 667:
                  theme = audit.get('liulang_resources', {})
                  with zipfile.ZipFile(apk) as archive:
                      actual = {name for name in archive.namelist() if name.startswith('assets/leotv/liulang/')}
                      if variant.startswith('tv'):
                          expected = {'assets/leotv/liulang/resources.bin', 'assets/leotv/liulang/resources.json'}
                          if not theme.get('enabled') or theme.get('min_api') != 23 or not theme.get('resource_only') or not theme.get('compiled_xml_audit', {}).get('post_r8_xml_constructors_verified') or actual != expected or set(theme.get('assets', {})) != expected:
                              raise SystemExit('TV theme requires API23 resource and actual R8 XML constructor audits.')
                          if any(hashlib.sha256(archive.read(name)).hexdigest() != theme['assets'][name] for name in expected):
                              raise SystemExit('TV theme asset differs from its audited resource package.')
                      elif theme.get('enabled') or not theme.get('mobile_payload_unchanged') or actual:
                          raise SystemExit('Phone APK must not contain the TV theme resource package.')
              if audit['version_code'] >= 650:
                  registers = audit.get('player_register_types', {})
                  if registers.get('method_count', 0) <= 0 or registers.get('hook_count', 0) <= 0:
                      raise SystemExit('The actual patched host register-type audit is required for 650 and later.')
              if audit['version_code'] >= 649 and profile == 'full':
                  native = audit.get('player_native', {})
                  expected_engine = 'mpv' if variant.startswith('mobile') else 'vlc'
                  program = audit.get('overlay_compile', {}).get('player_program', {})
                  if native.get('engine') != expected_engine or native.get('api') != 23 or native.get('errors') != [] \
                          or native.get('original_libraries_replaced') is not False or native.get('native_compiled_during_apk_build') is not False \
                          or audit.get('added_player_native_libraries_exact') != (11 if expected_engine == 'mpv' else 3) \
                          or audit.get('added_player_native_zip_alignment_kib') != 16 or not program.get('jni_names_and_signatures_preserved'):
                      raise SystemExit('Player input/API23/JNI/additive ZIP audit verification failed.')
                  source = audit.get('player_corresponding_source', {})
                  if not source.get('sha256') or not source.get('bytes'):
                      raise SystemExit('Exact corresponding-source delivery is required for the new player.')
                  if variant.startswith('tv'):
                      bundle = target / f'leotv-{variant}-player-source.tar.gz'
                      if source.get('source_commit') != data['head_sha'] or source.get('name') != bundle.name or bundle.stat().st_size != source['bytes'] \
                              or hashlib.sha256(bundle.read_bytes()).hexdigest() != source['sha256']:
                          raise SystemExit('VLC corresponding-source archive differs from its verified build.')
                      files.append(str(bundle))
              if profile == 'core':
                  native = audit.get('player_native', {})
                  program = audit.get('overlay_compile', {}).get('player_program', {})
                  if native.get('engine') != 'none' or native.get('api') != 23 or native.get('errors') != [] or audit.get('added_player_native_libraries_exact') != 0 or not program.get('additional_player_classes_absent') or audit.get('player_corresponding_source'):
                      raise SystemExit('Core APK must prove MPV/VLC native/program/source absence.')
              selected_channel = audit.get('release_channel', 'prerelease')
              if selected_channel not in ('stable', 'prerelease') or channel is not None and selected_channel != channel:
                  raise SystemExit('All APK products must use the same release channel.')
              channel = selected_channel
              if channel == 'stable':
                  hardening = audit.get('overlay_compile', {}).get('hardening', {})
                  if audit['version_code'] >= 661 and (hardening.get('external_hook_targets_verified', 0) <= 0 or hardening.get('missing_external_hook_targets') != 0):
                      raise SystemExit('Actual R8 output must resolve every preserved native hook target before release.')
                  if not audit.get('protected_release') or hardening.get('mode') != 'r8-release-full' or hardening.get('min_api') != 23 \
                          or not hardening.get('mapping_inputs_declared') or hardening.get('renamed_program_classes', 0) <= 0 \
                          or hardening.get('stable_abi_members_verified', 0) <= 0 or len(audit.get('added_dex_paths', [])) != 1:
                      raise SystemExit('Official APK release requires verified R8 protection and preserved ABI.')
                  if audit['version_code'] >= 645 and (not hardening.get('string_protection', {}).get('plaintext_absence_verified') \
                          or not hardening.get('string_protection', {}).get('roundtrip_verified') or not audit.get('full_audit_sha256')):
                      raise SystemExit('This release requires verified literal protection and a bound full private audit.')
              if version is not None and version != audit['version_name']:
                  raise SystemExit('All APK products must use the same Leotv version.')
              if staged_version is not None and staged_version != audit['version_name']:
                  raise SystemExit('Staged APK version differs from its source commit.')
              version = audit['version_name']
              files.extend([str(apk), str(target / f'leotv-{variant}.signature.json'),
                  str(target / f'leotv-{variant}-unsigned.audit.json')])
          if declared_products == list(PRODUCTS):
              for base in BASE_VARIANTS:
                  pair = parity.get(base,{})
                  if set(pair) != {'full','core'} or pair['full'] != pair['core']:
                      raise SystemExit('Full/core APKs differ outside the authorized MPV/VLC profile: ' + base)
          notes = root / 'notes.md'
          official = channel == 'stable'
          title = f'Leotv {version}' if official else f'Leotv {version}（固定签名测试）'
          profiles_note = '本次包含完整内核版和基础版各四套；基础版仅不含新增 MPV/VLC，其余功能一致。\n\n' if declared_products == list(PRODUCTS) else ''
          notes.write_text(profiles_note + f'Leotv {version} {"正式版" if official else "测试 APK"}，来自成功构建 #{run_id}。\n\n应用包名 com.leotv.app；提供 TV/手机、32/64 位共 {len(products)} 个固定签名 APK。保留已验收的原生详情、手机玻璃状态栏和悬浮导航、追更日历、跨订阅自动找源、收藏与续播。\n\n' +
              ('完整内核版手机可选择 MPV（含配置及着色器），TV可选择 VLC；基础版不含新增 MPV/VLC，原系统/IJK/Exo及共享进度、预载、弹幕特效和其他功能保持一致。VLC配套源码档随本次发布；MPV固定双ABI源码与构建配置：https://github.com/leotvgo/Leotv/releases/tag/leotv-player-native-api23-20261126-673ddfa1 。\n\n' if audit['version_code'] >= 649 else '') +
              ('新增代码采用 R8 release/full 混淆优化；保留数据库、JAR/JNI 与反射接口、Android 6 回移层和各 ABI 原生库。完整源码/变化审计与混淆映射保存在内部草稿，公开摘要与完整记录的 SHA-256 绑定。\n\n' if official else '') +
              f'Android 6（API 23）编译、原样/变化审计与固定签名检查已通过；签名后真机运行验收单独记录。\n\n构建：https://github.com/{repo}/actions/runs/{run_id}\n')
          tag = f'leotv-{version}' if official else f'leotv-{version}-build-{run_id}'
          def find_release(release_tag=tag):
              endpoint = f'repos/{repo}/releases/tags/{release_tag}'
              existing = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if existing.returncode == 0:
                  return json.loads(existing.stdout)
              if 'HTTP 404' not in existing.stderr:
                  raise SystemExit('Unable to inspect the target APK release.')
              # GitHub may not resolve a new draft through releases/tags until publication.
              pages = json.loads(subprocess.check_output(['gh', 'api',
                  f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp']))
              matches = [item for page in pages for item in page if item['tag_name'] == release_tag]
              if len(matches) > 1:
                  raise SystemExit('Multiple APK drafts use the same release tag.')
              return matches[0] if matches else None
          release = find_release()
          if official and release is None:
              release = find_release(f'leotv-{version}-build-{run_id}')
              if release is not None and not release['draft']:
                  raise SystemExit('Official release transport must remain a draft until promotion.')
          expected = {pathlib.Path(file).name: (pathlib.Path(file).stat().st_size,
              'sha256:' + hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()) for file in files}
          def verify_assets(release):
              if release['target_commitish'] != data['head_sha']:
                  raise SystemExit('Existing APK release targets a different source commit.')
              assets = {asset['name']: asset for asset in release['assets']}
              for name, (size, digest) in expected.items():
                  asset = assets.get(name)
                  if asset is None or asset['size'] != size or asset['state'] != 'uploaded':
                      raise SystemExit('APK release is incomplete: ' + name)
                  if asset.get('digest') and asset['digest'] != digest:
                      raise SystemExit('APK release asset checksum differs: ' + name)
          if release is not None and not release['draft']:
              verify_assets(release)
              print(release['html_url'])
              sys.exit(0)
          if release is None:
              subprocess.run(['gh', 'release', 'create', tag, '--repo', repo, '--target', data['head_sha'],
                  '--title', title, '--notes-file', str(notes),
                  '--draft', '--latest=false', *([] if official else ['--prerelease']), *files], check=True)
          else:
              if release['target_commitish'] != data['head_sha']:
                  raise SystemExit('Existing APK draft targets a different source commit.')
              if not official:
                  subprocess.run(['gh', 'release', 'upload', release['tag_name'], '--repo', repo, '--clobber', *files], check=True)
              else:
                  try:
                      verify_assets(release)
                  except SystemExit:
                      # Same-source drafts may have been interrupted during upload.
                      subprocess.run(['gh', 'release', 'upload', release['tag_name'], '--repo', repo, '--clobber', *files], check=True)
          release = find_release(release['tag_name'] if release is not None else tag)
          if release is None:
              raise SystemExit('Unable to locate the uploaded APK draft.')
          release_endpoint = f"repos/{repo}/releases/{release['id']}"
          release = json.loads(subprocess.check_output(['gh', 'api', release_endpoint]))
          verify_assets(release)
          subprocess.run(['gh', 'api', release_endpoint, '--method', 'PATCH',
              '--field', 'draft=false', '--field', 'prerelease=' + str(not official).lower(),
              '--raw-field', 'tag_name=' + tag, '--raw-field', 'name=' + title,
              '--raw-field', 'body=' + notes.read_text(),
              '--raw-field', 'make_latest=' + str(official).lower(), '--silent'], check=True)
          print(f'https://github.com/{repo}/releases/tag/{tag}')
          PY
      - name: Retain the latest ten published APK prereleases and remove older CI outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cleanup_test_releases.py --repo "$GITHUB_REPOSITORY" --keep 10 --apply
