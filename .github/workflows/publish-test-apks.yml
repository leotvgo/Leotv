name: Publish installable ordinary APK test release

on:
  workflow_run:
    workflows: [Build and audit ordinary APKs]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful fixed-signature build run
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: leotv-apk-release-${{ github.event.workflow_run.id || inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK publication guards and repeat handling
        run: python3 -B research/test_apk_publish_workflow.py
      - name: Retrieve verified signed APKs and publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          EXPECTED_CERT: ${{ vars.APK_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['BUILD_RUN_ID']
          if not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit('A positive build run ID is required.')
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if data['conclusion'] != 'success' or data['name'] != 'Build and audit ordinary APKs':
              raise SystemExit('A successful ordinary APK build run is required.')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publish-apks'
          files = []
          version = None
          for variant in ['tv-v7a', 'tv-v8a', 'mobile-v7a', 'mobile-v8a']:
              target = root / variant
              target.mkdir(parents=True, exist_ok=True)
              subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo, '--name',
                  f'ordinary-{variant}-signed', '--dir', str(target)], check=True)
              report = json.loads((target / f'leotv-{variant}.signature.json').read_text())
              audit = json.loads((target / f'leotv-{variant}-unsigned.audit.json').read_text())
              apk = target / f'leotv-{variant}.apk'
              if report['certificate_sha256'] != os.environ['EXPECTED_CERT'] or hashlib.sha256(apk.read_bytes()).hexdigest() != report['apk_sha256']:
                  raise SystemExit('Signed APK identity verification failed.')
              if audit['package'] != 'com.leotv.app' or not audit['expected_changes_match'] or not audit['baseline_audit']['equal']:
                  raise SystemExit('Leotv identity/source audit verification failed.')
              if version is not None and version != audit['version_name']:
                  raise SystemExit('Four APK variants must use the same Leotv version.')
              version = audit['version_name']
              files.extend([str(apk), str(target / f'leotv-{variant}.signature.json'),
                  str(target / f'leotv-{variant}-unsigned.audit.json')])
          notes = root / 'notes.md'
          notes.write_text(f'Leotv {version} 测试 APK，来自成功构建 #{run_id}。\n\n应用包名 com.leotv.app，可与原 OK影视同时安装；四个 TV/手机、32/64 位 APK 使用同一张固定签名证书。包含 Leotv 图标/动态 logo、常态透明上下栏与实时渐进模糊、独立原生详情页、本端主题及 TMDB 设置；手机按视频尺寸自动切换方向，收藏和续播继续使用原数据库模型。\n\nAndroid 6 V1 签名、原样基准和声明的代码/资源变更审计已通过。Android 6 真机、播放和界面视觉验收仍单独记录。\n\n构建：https://github.com/{repo}/actions/runs/{run_id}\n')
          tag = f'leotv-{version}-build-{run_id}'
          endpoint = f'repos/{repo}/releases/tags/{tag}'
          def find_release():
              existing = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if existing.returncode == 0:
                  return json.loads(existing.stdout)
              if 'HTTP 404' not in existing.stderr:
                  raise SystemExit('Unable to inspect the target APK release.')
              # GitHub may not resolve a new draft through releases/tags until publication.
              pages = json.loads(subprocess.check_output(['gh', 'api',
                  f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp']))
              matches = [item for page in pages for item in page if item['tag_name'] == tag]
              if len(matches) > 1:
                  raise SystemExit('Multiple APK drafts use the same release tag.')
              return matches[0] if matches else None
          release = find_release()
          expected = {pathlib.Path(file).name: (pathlib.Path(file).stat().st_size,
              'sha256:' + hashlib.sha256(pathlib.Path(file).read_bytes()).hexdigest()) for file in files}
          def verify_assets(release):
              if release['target_commitish'] != data['head_sha']:
                  raise SystemExit('Existing APK release targets a different source commit.')
              assets = {asset['name']: asset for asset in release['assets']}
              for name, (size, digest) in expected.items():
                  asset = assets.get(name)
                  if asset is None or asset['size'] != size or asset['state'] != 'uploaded':
                      raise SystemExit('APK release is incomplete: ' + name)
                  if asset.get('digest') and asset['digest'] != digest:
                      raise SystemExit('APK release asset checksum differs: ' + name)
          if release is not None and not release['draft']:
              verify_assets(release)
              print(release['html_url'])
              sys.exit(0)
          if release is None:
              subprocess.run(['gh', 'release', 'create', tag, '--repo', repo, '--target', data['head_sha'],
                  '--title', f'Leotv {version}（固定签名测试）', '--notes-file', str(notes),
                  '--draft', '--prerelease', '--latest=false', *files], check=True)
          else:
              if release['target_commitish'] != data['head_sha']:
                  raise SystemExit('Existing APK draft targets a different source commit.')
              subprocess.run(['gh', 'release', 'upload', tag, '--repo', repo, '--clobber', *files], check=True)
          release = find_release()
          if release is None:
              raise SystemExit('Unable to locate the uploaded APK draft.')
          release_endpoint = f"repos/{repo}/releases/{release['id']}"
          release = json.loads(subprocess.check_output(['gh', 'api', release_endpoint]))
          verify_assets(release)
          subprocess.run(['gh', 'api', release_endpoint, '--method', 'PATCH',
              '--field', 'draft=false', '--field', 'prerelease=true',
              '--raw-field', 'make_latest=false', '--silent'], check=True)
          print(f'https://github.com/{repo}/releases/tag/{tag}')
          PY
