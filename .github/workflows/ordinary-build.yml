name: Build and audit ordinary APKs

on:
  workflow_dispatch:
    inputs:
      run_validation_tests:
        description: Run model and UI regression suites
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit source tree
        run: bash scripts/audit-release-tree.sh
      - name: Verify all four source variants and ordered native hooks
        run: python3 -B tools/check_build_sources.py
      - name: Verify pinned native sources and exact JNI build recipe
        run: python3 -B tools/check_player_native.py --sources
      - name: Verify preserved 649 sources, player variant separation and immutable input/source delivery
        run: python3 -B tools/check_player_integration.py
      - name: Verify ported episode normalization and detail precedence using fictional fixtures
        run: python3 -B research/check_episode_port.py
      - name: Verify entry and history metadata do not wait for a blocked provider
        run: python3 -B research/check_detail_parallel.py
      - name: Verify preload pause, expiry, subscription identity and episode boundaries
        run: python3 -B research/check_video_preload_policy.py
      - name: Verify all-site raw preload handoff across native playback header reset
        run: python3 -B research/check_video_preload_handoff.py
      - name: Verify shared TMDB progress, native episode boundaries, history deletion and Pro spacing
        run: python3 -B research/check_detail_progress.py
      - name: Verify stable effect sampling, nine styles and one animation using fictional comments
        run: python3 -B research/check_danmaku_effect_policy.py

  effects:
    needs: sources
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify nine native effect templates, font and opacity, coordinates and cache bounds on API23
        run: gradle --no-daemon --console=plain --max-workers=2 -p research/effects-check test

  prepare:
    needs: [sources, effects]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify release draft ownership and upload recovery
        run: python3 -B research/test_ci_release_store.py
      - name: Prepare unique APK and private mapping drafts before parallel builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/prepare_ci_release.py

  models:
    needs: sources
    if: ${{ inputs.run_validation_tests }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit source tree
        run: bash scripts/audit-release-tree.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 6 compile references
        run: |
          sdkmanager 'platforms;android-23' 'build-tools;36.1.0'
          command -v zstd || sudo apt-get install -y zstd
      - name: Fetch pinned inputs and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_dependencies.py --output "$RUNNER_TEMP/deps"
          python3 tools/ci_input.py --repo "$GITHUB_REPOSITORY" --variant tv-v7a --output "$RUNNER_TEMP/input"
      - name: Compile restored Java and test scalar JSON contracts
        run: |
          python3 tools/check_config_source.py --all-models \
            --apk "$RUNNER_TEMP/input/leanback-armeabi_v7a.apk" \
            --apktool "$RUNNER_TEMP/deps/apktool_2.11.0.jar" \
            --sdk "$ANDROID_SDK_ROOT" \
            --gson-jar "$RUNNER_TEMP/deps/gson-2.13.2.jar" \
            --xml-jar "$RUNNER_TEMP/deps/simple-xml-2.7.1.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify native chrome geometry and progressive blur
        run: gradle --no-daemon --console=plain --max-workers=2 -p research/ui-check test
      - name: Verify native detail routing, playback, metadata and client themes on API 23
        run: |
          python3 tools/check_native_details.py --all-variants
          gradle --no-daemon --console=plain --max-workers=2 -p research/detail-check -Pclient=mobile test
          gradle --no-daemon --console=plain --max-workers=2 -p research/detail-check -Pclient=tv test
      - uses: actions/upload-artifact@v4
        with:
          name: native-detail-api23-check
          path: |
            research/detail-check/build/*/test-results/test/*.xml
            artifacts/detail-preview/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-chrome-api23-and-render-check
          path: |
            research/ui-check/build/test-results/test/*.xml
            artifacts/ui-preview/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: restored-core-api23-check
          path: evidence/core-source-check.json
          retention-days: 14

  apk:
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: tv-v7a
            filename: leanback-armeabi_v7a.apk
          - variant: tv-v8a
            filename: leanback-arm64_v8a.apk
          - variant: mobile-v7a
            filename: mobile-armeabi_v7a.apk
          - variant: mobile-v8a
            filename: mobile-arm64_v8a.apk
    steps:
      - uses: actions/checkout@v4
      - name: Audit source tree
        run: bash scripts/audit-release-tree.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-23' 'build-tools;36.1.0' 'ndk;27.0.12077973'
          command -v zstd || sudo apt-get install -y zstd
      - name: Fetch pinned inputs and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 tools/ci_dependencies.py --output "$RUNNER_TEMP/deps"
          python3 tools/ci_input.py --repo "$GITHUB_REPOSITORY" --variant "$VARIANT" --output "$RUNNER_TEMP/input"
      - name: Stage permanent API23 player input and matching Java/source archives without native compilation
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 -B tools/stage_player_inputs.py --variant "$VARIANT" \
            --ndk "$ANDROID_SDK_ROOT/ndk/27.0.12077973" \
            --work "$RUNNER_TEMP/player-download" --output "$RUNNER_TEMP/player-input"
      - name: Build Leotv and verify the baseline plus declared identity and UI changes
        env:
          VARIANT: ${{ matrix.variant }}
          INPUT_FILENAME: ${{ matrix.filename }}
        run: |
          python3 tools/build_branded.py --variant "$VARIANT" \
            --apk "$RUNNER_TEMP/input/$INPUT_FILENAME" \
            --apktool "$RUNNER_TEMP/deps/apktool_2.11.0.jar" \
            --r8 "$RUNNER_TEMP/deps/r8-8.8.34.jar" \
            --player-input "$RUNNER_TEMP/player-input" \
            --player-ndk "$ANDROID_SDK_ROOT/ndk/27.0.12077973" \
            --sdk "$ANDROID_SDK_ROOT" \
            --output "artifacts/leotv-$VARIANT-unsigned.apk"
      - name: Sign installable APK with the fixed APK certificate
        env:
          VARIANT: ${{ matrix.variant }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_SIGNING_ALIAS: ${{ vars.APK_SIGNING_ALIAS }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
        run: |
          python3 tools/sign_ci_apk.py --sdk "$ANDROID_SDK_ROOT" \
            --input "artifacts/leotv-$VARIANT-unsigned.apk" \
            --output "artifacts/leotv-$VARIANT.apk"
      - name: Archive protected R8 mappings in a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/stage_ci_apk.py --variant "$VARIANT" --symbols
      - name: Publish only a bound audit summary after preserving the full source audit privately
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/public_apk_audit.py --variant "$VARIANT"
      - id: signed_artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ordinary-${{ matrix.variant }}-signed
          path: |
            artifacts/leotv-${{ matrix.variant }}.apk
            artifacts/leotv-${{ matrix.variant }}.signature.json
            artifacts/leotv-${{ matrix.variant }}-unsigned.audit.json
            artifacts/leotv-${{ matrix.variant }}-player-source.tar.gz
          retention-days: 14
      - name: Stage verified APK in a release draft when Actions storage is unavailable
        if: steps.signed_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/stage_ci_apk.py --variant "$VARIANT"
