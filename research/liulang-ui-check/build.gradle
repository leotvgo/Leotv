plugins { id 'java' }
repositories { mavenCentral(); google() }
sourceSets {
    main.java.srcDirs=['src/stub/java']
    test.java.srcDirs=['src/test/java']
}
tasks.named('compileJava') {
    source '../../detail/runtime/tv/com/leotv/detail/LiulangWallpaper.java', '../../detail/runtime/tv/com/leotv/detail/LiulangSurfaces.java', '../../detail/runtime/tv/com/leotv/detail/LiulangResources.java', '../../detail/runtime/tv/com/leotv/detail/LiulangStyle.java', '../../detail/runtime/tv/com/leotv/detail/LiulangHeroImage.java', '../../detail/runtime/tv/com/leotv/detail/LiulangBackdrop.java', '../../detail/runtime/tv/com/leotv/detail/LiulangDots.java', '../../detail/runtime/tv/com/leotv/detail/LiulangRoundedImage.java', '../../detail/runtime/tv/com/leotv/detail/LiulangFlow.java', '../../detail/runtime/tv/com/leotv/detail/LiulangHistoryBar.java'
}
dependencies {
    compileOnly 'org.robolectric:android-all:15-robolectric-12650502'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'org.robolectric:android-all:15-robolectric-12650502'
}
def aarClasses=layout.buildDirectory.dir('aar-classes')
tasks.register('extractAars') { inputs.files(configurations.testRuntimeClasspath);outputs.dir(aarClasses);doLast {configurations.testRuntimeClasspath.files.findAll{it.name.endsWith('.aar')}.each {aar->copy{from zipTree(aar);include 'classes.jar';into aarClasses.get().dir(aar.name);filePermissions{unix('0644')}}}} }
test {
    dependsOn 'extractAars'
    classpath += files(provider {fileTree(aarClasses).matching{include '**/*.jar'}})
    systemProperty 'robolectric.dependency.repo.url','https://repo.maven.apache.org/maven2'
    systemProperty 'leotv.liulang.payload',file('../../artifacts/liulang-ui-fixture').absolutePath
    systemProperty 'leotv.liulang.preview',file('../../artifacts/liulang-preview').absolutePath
    maxHeapSize='1g'
    testLogging {events 'passed','failed';exceptionFormat 'full'}
}
