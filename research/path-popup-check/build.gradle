plugins { id 'java' }
repositories { mavenCentral(); google() }
sourceSets {
    main.java.srcDirs = ['../../detail/runtime/common', 'src/stub/java']
    main.java.include 'com/leotv/detail/MobileSourceBar.java', 'com/leotv/detail/DetailSourcePopup.java', 'com/leotv/detail/NativeViews.java', 'com/leotv/detail/PlaybackPaths.java', 'com/leotv/detail/Device.java', 'com/leotv/detail/DetailHero.java', 'com/leotv/detail/SiteFeed.java', 'com/leotv/detail/MetadataCache.java', 'com/leotv/detail/NativeRouting.java', 'com/leotv/detail/PreloadHost.java'
    // The fixtures above replace only provider/configuration dependencies; these Views and clicks are production code.
    main.java.exclude { it.file.isFile() && it.file.path.contains('/detail/runtime/common/') && !(it.file.name in ['MobileSourceBar.java','DetailSourcePopup.java','NativeViews.java','PlaybackPaths.java']) }
}
dependencies {
    compileOnly 'org.robolectric:android-all:15-robolectric-12650502'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.robolectric:android-all:15-robolectric-12650502'
}
def aarClasses = layout.buildDirectory.dir('aar-classes')
tasks.register('extractAars') {
    inputs.files(configurations.testRuntimeClasspath)
    outputs.dir(aarClasses)
    doLast { configurations.testRuntimeClasspath.files.findAll { it.name.endsWith('.aar') }.each { aar ->
        copy { from zipTree(aar); include 'classes.jar'; into aarClasses.get().dir(aar.name); filePermissions { unix('0644') } }
    } }
}
test {
    dependsOn 'extractAars'
    classpath += files(provider { fileTree(aarClasses).matching { include '**/*.jar' } })
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    maxHeapSize = '768m'
    maxParallelForks = 1
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
